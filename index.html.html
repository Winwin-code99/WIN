<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的产品作品集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }
    .header h1 {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .header p {
      color: #666;
      font-size: 15px;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px 24px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-color: #667eea;
    }
    .card-inner {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .card-icon.c1 { background: #f0f4ff; }
    .card-icon.c2 { background: #fff0f3; }
    .card-icon.c3 { background: #f0fff4; }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 13px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-arrow {
      color: #667eea;
      font-size: 20px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .card:hover .card-arrow {
      transform: translateX(4px);
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="avatar">P</div>
      <h1>我的产品作品集</h1>
      <p>产品经理 · PRD 文档合集</p>
    </div>

    <div class="card-list">
      <a href="https://e85x7g.axshare.com/" target="_blank" class="card">
        <div class="card-inner">
          <div class="card-icon c1">🏋️</div>
          <div class="card-info">
            <div class="card-title">减肥大赛项目</div>
            <div class="card-desc">e85x7g.axshare.com</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </a>

      <a href="https://twswau.axshare.com/" target="_blank" class="card">
        <div class="card-inner">
          <div class="card-icon c2">🔐</div>
          <div class="card-info">
            <div class="card-title">用户认证项目</div>
            <div class="card-desc">twswau.axshare.com</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </a>

      <a href="https://pahymi.axshare.com/" target="_blank" class="card">
        <div class="card-inner">
          <div class="card-icon c3">🔌</div>
          <div class="card-info">
            <div class="card-title">智能厨电设备数据同步项目</div>
            <div class="card-desc">pahymi.axshare.com</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </a>
    </div>

    <div class="footer">
      © 2026 产品作品集
    </div>
  </div>
</body>
</html>
